# ORL audit on pull requests (dev branch of on-pull-request-runner).
# Requires repo secret: GOMBOC_ACCESS_TOKEN
# Docs: https://github.com/Gomboc-AI/actions/tree/dev-4567/on-pull-request-runner
name: Gomboc ORL on pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  gomboc-orl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: Gomboc-AI/actions/on-pull-request-runner@dev-4567
        with:
          mode: remediate
        env:
          GOMBOC_ACCESS_TOKEN: ${{ secrets.GOMBOC_ACCESS_TOKEN }}
